/* ===== ECOwatt 20261287 — تطبيق المندوب (البند 13 — النسخة الأولى: المندوب فقط) =====
   • الدخول بنفس اسم المستخدم والرقم السري • الصلاحيات من الخادم
   • عملائي وأرصدتهم • طلب بيع • سند قبض (نقد أو شيك مع صورة) • عمولتي
   • يعمل بدون إنترنت: البيانات من آخر تحميل، والطلبات تُحفظ في «صندوق الإرسال» وتُرسل تلقائياً عند رجوع الاتصال بنفس الرقم (لا تكرار)
   • كل ما يُرسل يدخل كطلب على مسار الموافقات ولا يُرحَّل مباشرة */
var URL_='https://script.google.com/macros/s/AKfycbwwgY1U4QpfAV489MkN7rPfemC0sSkN8QTgTh4D8PO5dBkIh6J8TOPBR0s-CswSpiNrPQ/exec';
function _sha256(ascii){
function rr(v,a){return (v>>>a)|(v<<(32-a));}
var maxWord=Math.pow(2,32), result='', i, j, words=[], bitLen=ascii.length*8;
var hash=[], k=[], pc=0, comp={};
for(var c=2;pc<64;c++){
if(!comp[c]){
for(i=0;i<313;i+=c) comp[i]=c;
hash[pc]=(Math.pow(c,.5)*maxWord)|0;
k[pc++]=(Math.pow(c,1/3)*maxWord)|0;
}
}
ascii+='\x80';
while(ascii.length%64-56) ascii+='\x00';
for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
words[words.length]=((bitLen/maxWord)|0);
words[words.length]=bitLen;
for(j=0;j<words.length;){
var w=words.slice(j,j+=16), old=hash;
hash=hash.slice(0,8);
for(i=0;i<64;i++){
var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+
(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
hash=[(t1+t2)|0].concat(hash);
hash[4]=(hash[4]+t1)|0;
}
for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
}
for(i=0;i<8;i++) for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); }
return result;
}

function credHash(u,p){u=String(u||'').trim().toLowerCase().replace(/[أإآ]/g,'ا');p=String(p||'').trim().replace(/[٠-٩]/g,function(d){return String(d.charCodeAt(0)-1632);});return _sha256(unescape(encodeURIComponent('ecowatt|'+u+'|'+p)));}

function G(k,d){try{var v=localStorage.getItem('rep_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}

function uidReq(){var s='REQ-M';for(var i=0;i<10;i++)s+='0123456789ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*34|0];return s;}

window.addEventListener('online',function(){netBadge();flush();});window.addEventListener('offline',netBadge);
function login(){A.innerHTML='<main><div class="card"><h3 style="margin:0 0 8px;color:#0a246a">تسجيل الدخول</h3><label>اسم المستخدم</label><input id="u" autocomplete="username"><label>الرقم السري</label><input id="p" type="password" autocomplete="current-password"><button class="btn" id="go">دخول</button><div id="err" class="bad" style="margin-top:8px"></div></div><p class="mut">نفس اسم المستخدم والرقم السري المستعملين في برنامج إيكوواط.</p></main>';
 document.getElementById('go').onclick=function(){var u=document.getElementById('u').value,p=document.getElementById('p').value,er=document.getElementById('err');if(!u||!p){er.textContent='أدخل البيانات';return;}
  var nu=String(u).trim().toLowerCase().replace(/[أإآ]/g,'ا');er.textContent='⏳ جارٍ التحقق…';
  api({action:'auth:login',u:nu,h:credHash(u,p)}).then(function(r){if(!r||!r.ok){er.textContent=r&&r.error==='locked'?'تم إيقاف الدخول مؤقتاً بعد محاولات متكررة.':'اسم المستخدم أو الرقم السري غير صحيح.';return;}
   P('token',r.token);P('user',r.user||{});load(true);}).catch(function(){er.textContent='تعذّر الاتصال بالخادم.';});};}

 if(!navigator.onLine&&S.boot){render();return;}

  r.at=Date.now();S.boot=r;P('boot',r);render();flush();}).catch(function(){if(S.boot)render();else A.innerHTML='<main><div class="card bad">لا يوجد اتصال، ولا بيانات محفوظة بعد. اتصل بالإنترنت مرة واحدة.</div></main>';});}

var LOCKED=false;
function bioLock(then){LOCKED=true;A.innerHTML='<main><div class="card" style="text-align:center;margin-top:40px"><div style="font-size:54px">🔐</div><h3 style="color:#0a246a">تطبيق المندوب مقفل</h3><button class="btn" id="bu">👆 فتح بالبصمة</button><button class="btn s" id="bp">الدخول بالرقم السري بدلاً منها</button><div class="bad" id="be" style="margin-top:8px"></div></div></main>';
 var go=function(){bioCheck().then(function(){LOCKED=false;S.hid=0;then();}).catch(function(e){document.getElementById('be').textContent=e&&e.name==='NotAllowedError'?'لم تُقبل البصمة — حاول مرة أخرى.':'تعذّرت البصمة على هذا الجهاز.';});};
 document.getElementById('bu').onclick=go;document.getElementById('bp').onclick=function(){LOCKED=false;logout();};setTimeout(go,300);}
document.addEventListener('visibilitychange',function(){if(document.hidden){S.hid=Date.now();return;}
 if(!LOCKED&&G('bio',null)&&G('token','')&&S.hid&&Date.now()-S.hid>3*60*1000)bioLock(function(){render();});});

 [].forEach.call(A.querySelectorAll('nav button'),function(x){x.onclick=function(){S.tab=x.getAttribute('data-t');render();};});
 var head='<div class="mut">المندوب: '+E(b.rep&&b.rep.name)+' • آخر تحديث: '+new Date(b.at||Date.now()).toLocaleString('ar')+' <a href="#" id="rf">تحديث</a> • <a href="#" id="lo">خروج</a></div><div class="row" style="margin:6px 0"><a class="btn s" style="padding:8px;flex:1;text-align:center;text-decoration:none" href="'+ATT_URL+'" target="_blank" rel="noopener">🕘 الحضور</a>'+(bioCan()?'<button class="btn s" style="padding:8px;flex:1" id="bio">'+(G('bio',null)?'🔐 البصمة مفعّلة':'👆 تفعيل البصمة')+'</button>':'')+'</div>';
 if(S.tab==='cust'){var tot=(b.customers||[]).reduce(function(s,c){return s+c.bal;},0);
  M.innerHTML=head+'<div class="card row"><span>عدد العملاء: <b>'+(b.customers||[]).length+'</b></span><span>مجموع الأرصدة: <b class="num">'+fm(tot)+'</b></span></div><input id="q" placeholder="بحث بالاسم أو الهاتف">'+'<div id="cl"></div>';
  var paint=function(){var q=document.getElementById('q').value.trim();document.getElementById('cl').innerHTML=(b.customers||[]).filter(function(c){return !q||(c.name+' '+c.phone+' '+c.no).indexOf(q)>-1;}).map(function(c){var over=c.limit&&c.bal>c.limit;return '<div class="card"><div class="row"><b>'+E(c.name)+'</b><b class="num '+(over?'bad':'')+'">'+fm(c.bal)+'</b></div><div class="mut">'+E([c.no,c.phone,c.region,c.limit?('السقف '+fm(c.limit)):''].filter(Boolean).join(' • '))+(over?' • <span class="bad">تجاوز السقف</span>':'')+'</div>'+(c.phone?'<div class="row" style="margin-top:6px"><a href="tel:'+E(c.phone)+'">📞 اتصال</a><a href="https://wa.me/'+E(String(c.phone).replace(/^0/,'970'))+'">💬 واتساب</a></div>':'')+'<button class="btn s" style="margin-top:8px;padding:9px" data-stm="'+E(c.no)+'">📄 كشف حساب للعميل</button></div>';}).join('')||'<div class="mut">لا يوجد</div>';
   [].forEach.call(document.querySelectorAll('[data-stm]'),function(x){x.onclick=function(){stmtAsk(custOf(x.getAttribute('data-stm')));};});};
  document.getElementById('q').oninput=paint;paint();}
 if(S.tab==='so'){var IT=b.items||[],L=[{id:'',q:1,p:''}];
  var itemOf=function(id){return IT.filter(function(x){return x.id===id;})[0]||null;};

   [].forEach.call(document.querySelectorAll('#ls input'),function(el){el.onchange=el.oninput=function(){var i=+el.getAttribute('data-i'),k=el.getAttribute('data-k');

 if(S.tab==='rc'){var photo='';
  M.innerHTML=head+'<div class="card"><label>العميل</label><select id="c">'+custOpts('')+'</select><label>المبلغ</label><input id="am" type="number" inputmode="decimal"><label>العملة</label><select id="cu"><option>شيكل</option><option>دينار</option><option>دولار</option></select><label>طريقة الدفع</label><select id="pm"><option value="نقداً">نقداً</option><option value="شيك">شيك</option></select><div id="cq" style="display:none"><label>رقم الشيك</label><input id="cn" inputmode="numeric"><label>البنك</label><input id="bk"><label>تاريخ الاستحقاق</label><input id="du" type="date"><label>صورة الشيك</label><input id="ph" type="file" accept="image/*" capture="environment"><img class="prev" id="pv" style="display:none"></div><label>ملاحظات</label><textarea id="nt" rows="2"></textarea><button class="btn" id="sv">📤 إرسال للموافقة</button><div class="mut">يدخل كطلب على مسار الموافقات ولا يُرحَّل مباشرة.</div></div>';

function modal(title,html,btns){var o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(10,36,106,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center';

 var B=o.querySelector('#mb');(btns||[]).concat([['إغلاق',null,1]]).forEach(function(b){var x=document.createElement('button');x.className='btn'+(b[2]?' s':'');x.textContent=b[0];x.onclick=function(){if(b[1]){var r=b[1](o);if(r===false)return;}o.remove();};B.appendChild(x);});
 o.addEventListener('click',function(e){if(e.target===o)o.remove();});document.body.appendChild(o);return o;}
var PW=1240,PH=1754,MX=70;
function lh(){return (S.boot&&S.boot.lh)||{name:'إيكوواط'};}
function wrapText(c,t,w){var words=String(t||'').split(' '),lines=[],cur='';words.forEach(function(x){var tr=cur?cur+' '+x:x;if(c.measureText(tr).width>w&&cur){lines.push(cur);cur=x;}else cur=tr;});if(cur)lines.push(cur);return lines;}
function pageStart(spec,pn,pages){var cv=document.createElement('canvas');cv.width=PW;cv.height=PH;var c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,PW,PH);c.direction='rtl';
 var h=lh();c.fillStyle='#0a246a';c.fillRect(0,0,PW,170);c.fillStyle='#ff8c00';c.fillRect(0,170,PW,8);
 c.fillStyle='#fff';c.textAlign='right';c.font='bold 34px Tahoma, Arial, sans-serif';wrapText(c,h.name,PW-2*MX).slice(0,2).forEach(function(l,i){c.fillText(l,PW-MX,62+i*42);});
 c.font='20px Tahoma, Arial, sans-serif';c.textAlign='left';c.direction='ltr';if(h.en)c.fillText(h.en.slice(0,90),MX,150);c.direction='rtl';c.textAlign='right';
 c.fillStyle='#4b5563';c.font='20px Tahoma, Arial, sans-serif';if(h.addr)c.fillText(h.addr,PW-MX,210);
 c.fillStyle='#0a246a';c.font='bold 44px Tahoma, Arial, sans-serif';c.fillText(spec.title,PW-MX,285);
 var y=300;if(spec.badge){c.font='bold 26px Tahoma, Arial, sans-serif';var w=c.measureText(spec.badge).width+40;c.fillStyle=spec.badgeColor||'#fff4e5';c.fillRect(PW-MX-w,y,w,48);c.strokeStyle=spec.badgeLine||'#ff8c00';c.lineWidth=3;c.strokeRect(PW-MX-w,y,w,48);c.fillStyle=spec.badgeText||'#8a4b00';c.fillText(spec.badge,PW-MX-20,y+33);y+=70;}
 c.font='20px Tahoma, Arial, sans-serif';c.fillStyle='#6b7280';c.textAlign='left';c.fillText('صفحة '+pn+' / '+pages,MX,PH-40);c.textAlign='right';
 c.fillText((spec.footer||'')+' • '+new Date().toLocaleString('ar'),PW-MX,PH-40);c.strokeStyle='#e8e6e0';c.lineWidth=2;c.beginPath();c.moveTo(MX,PH-75);c.lineTo(PW-MX,PH-75);c.stroke();
 return {cv:cv,c:c,y:y+10};}
function drawFields(P,F){var c=P.c,y=P.y;F.forEach(function(f){c.font='22px Tahoma, Arial, sans-serif';c.fillStyle='#6b7280';c.textAlign='right';c.fillText(f[0],PW-MX,y+30);c.font='bold 28px Tahoma, Arial, sans-serif';c.fillStyle='#111827';
 var lines=wrapText(c,f[1],PW-2*MX-280);lines.forEach(function(l,i){c.fillText(l,PW-MX-280,y+30+i*38);});y+=Math.max(1,lines.length)*38+18;c.strokeStyle='#f1f1ef';c.beginPath();c.moveTo(MX,y-8);c.lineTo(PW-MX,y-8);c.stroke();});P.y=y+10;}
function renderDoc(spec){/* spec: title,badge,fields,table{heads,w,rows,num},after(fields),footer,sign */
 var pages=[],rows=(spec.table&&spec.table.rows)||[],per=0;
 function newPage(){var P=pageStart(spec,pages.length+1,0);pages.push(P);return P;}
 var P=newPage();drawFields(P,spec.fields||[]);
 if(spec.table){var T=spec.table,W=T.w,c,xR;var head=function(P){c=P.c;c.fillStyle='#0a246a';c.fillRect(MX,P.y,PW-2*MX,50);c.fillStyle='#fff';c.font='bold 21px Tahoma, Arial, sans-serif';xR=PW-MX;T.heads.forEach(function(h,i){c.textAlign='right';c.fillText(h,xR-10,P.y+33);xR-=W[i];});P.y+=50;};
  head(P);rows.forEach(function(r,ri){if(P.y>PH-200){P=newPage();head(P);}c=P.c;if(ri%2){c.fillStyle='#faf9f6';c.fillRect(MX,P.y,PW-2*MX,44);}c.fillStyle='#111827';c.font='20px Tahoma, Arial, sans-serif';xR=PW-MX;
   r.forEach(function(v,i){var s=String(v==null?'':v);if(T.num&&T.num[i]){c.direction='ltr';c.textAlign='left';c.fillText(s,xR-W[i]+10,P.y+30);c.direction='rtl';}else{c.textAlign='right';while(s.length>3&&c.measureText(s).width>W[i]-16)s=s.slice(0,-2);c.fillText(s,xR-10,P.y+30);}xR-=W[i];});P.y+=44;});P.y+=20;}
 if(spec.after){if(P.y>PH-120-spec.after.length*60)P=newPage();drawFields(P,spec.after);}
 if(spec.sign){var c2=P.c;c2.font='22px Tahoma, Arial, sans-serif';c2.fillStyle='#374151';c2.textAlign='right';c2.fillText(spec.sign,PW-MX,Math.min(P.y+80,PH-110));}
 /* أرقام الصفحات بعد معرفة العدد */

 return pages.map(function(p){return p.cv;});}
function b64bytes(d){var s=atob(d.split(',')[1]),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function makePdf(canvases){/* PDF بسيط: كل صفحة صورة JPEG بحجم A4 */
 var enc=new TextEncoder(),parts=[],off=0,xref=[];function add(x){var b=typeof x==='string'?enc.encode(x):x;parts.push(b);off+=b.length;}
 add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'.replace(/[\xE2\xE3\xCF\xD3]/g,'A'));var n=canvases.length,objs=2+n*3;
 xref[1]=off;add('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n');
 xref[2]=off;add('2 0 obj<</Type/Pages/Count '+n+'/Kids['+canvases.map(function(_,i){return (3+i*3)+' 0 R';}).join(' ')+']>>endobj\n');
 canvases.forEach(function(cv,i){var p=3+i*3,im=p+1,ct=p+2,jpg=b64bytes(cv.toDataURL('image/jpeg',0.85)),cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  xref[p]=off;add(p+' 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 '+im+' 0 R>>>>/Contents '+ct+' 0 R>>endobj\n');
  xref[im]=off;add(im+' 0 obj<</Type/XObject/Subtype/Image/Width '+cv.width+'/Height '+cv.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>stream\n');add(jpg);add('\nendstream endobj\n');
  xref[ct]=off;add(ct+' 0 obj<</Length '+cs.length+'>>stream\n'+cs+'\nendstream endobj\n');});
 var xo=off,t='xref\n0 '+(objs+1)+'\n0000000000 65535 f \n';for(var k=1;k<=objs;k++)t+=String(xref[k]).padStart(10,'0')+' 00000 n \n';add(t+'trailer<</Size '+(objs+1)+'/Root 1 0 R>>\nstartxref\n'+xo+'\n%%EOF');
 return new Blob(parts,{type:'application/pdf'});}
function toBlob(cv){return new Promise(function(res){cv.toBlob(function(b){res(b);},'image/png');});}
function shareFiles(files,text,phone){var can=navigator.canShare&&navigator.canShare({files:files});

 if(phone)setTimeout(function(){window.open('https://wa.me/'+String(phone).replace(/\D/g,'').replace(/^0/,'970')+'?text='+encodeURIComponent(text),'_blank');},800);

function rcSpec(x,official,st){var d=x.data||{},c=custOf(d['رقم حساب العميل'])||{};var F=[['استلمنا من',d['استلمنا من']],['رقم الحساب',d['رقم حساب العميل']],['المبلغ',d['المبلغ']+' '+(d['العملة']||'')],['طريقة الدفع',d['طريقة الدفع']]];
 if(d['رقم الشيك'])F.push(['الشيك','رقم '+d['رقم الشيك']+' • '+(d['البنك']||'')+' • استحقاق '+(d['تاريخ الاستحقاق']||'')]);if(d['ملاحظات'])F.push(['ملاحظات',d['ملاحظات']]);

  askSend('📄 كشف حساب — '+r.customer.name+' ('+r.rows.length+' حركة • الرصيد '+fm(r.closing)+')',function(){return spec;},'كشف-حساب-'+r.customer.no+'-'+r.to,'كشف حساب من إيكوواط — الرصيد الحالي '+fm(r.closing),r.customer.phone);});return true;}
