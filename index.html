<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a246a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>إيكوواط — المندوب</title>
<style>body{margin:0;background:#f1f1ef;font:15px Tahoma,Arial,sans-serif;color:#1f2937;direction:rtl}#ld{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;text-align:center;padding:20px}#ld b{color:#0a246a;font-size:18px}#ld small{color:#6b7280}</style>
</head>
<body>
<div id="ld"><b>إيكوواط — المندوب</b><span id="lm">جارٍ التحميل…</span><small id="ls"></small></div>
<script>
/* ===== ECOwatt 20261360 — مُحمِّل تطبيق المندوب (يُرفع مرة واحدة إلى GitHub مكان index.html)
   تطبيق المندوب أصبح جزءاً من ملف البرنامج الواحد على Drive (نفس رقم الإصدار).
   • عند الفتح: يعرض آخر نسخة محفوظة على الموبايل فوراً (يعمل بدون إنترنت).
   • يفحص الخادم عند الفتح وكل 15 دقيقة. إصدار أحدث ← ينزّله في الخلفية ← شريط أحمر بعدّاد دقيقة ← يُعاد الفتح على الإصدار الجديد.
   • نفس عنوان الصفحة ونفس مكان التخزين، فبيانات المندوب المحفوظة على الموبايل (الدخول، الزيارات غير المرسلة) تبقى كما هي.
   • إن لم يوجد شيء محفوظ ولا إنترنت: يفتح rep.html (النسخة المرفقة مع المُحمِّل). ===== */
var URL_='https://script.google.com/macros/s/AKfycbwwgY1U4QpfAV489MkN7rPfemC0sSkN8QTgTh4D8PO5dBkIh6J8TOPBR0s-CswSpiNrPQ/exec';
var LOADER=20261360;
function idb(){return new Promise(function(res,rej){try{var q=indexedDB.open('eco_rep_loader',1);q.onupgradeneeded=function(){try{q.result.createObjectStore('kv');}catch(e){}};q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};}catch(e){rej(e);}});}
function iget(){return idb().then(function(d){return new Promise(function(res){try{var q=d.transaction('kv','readonly').objectStore('kv').get('app');q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};}catch(e){res(null);}});}).catch(function(){return null;});}
function iput(o){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction('kv','readwrite');t.objectStore('kv').put(o,'app');t.oncomplete=function(){res(true);};t.onerror=function(){rej(t.error);};});});}
function post(o){return fetch(URL_,{method:'POST',body:JSON.stringify(o)}).then(function(r){return r.json();});}
function b64utf8(b){var bin=atob(b),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
function extract(html){var m=/<script type="application\/x-eco-rep" id="eco-rep-app" data-v="(\d+)">([A-Za-z0-9+\/=\s]+)<\/script>/.exec(html);if(!m)return null;return {v:+m[1],rep:b64utf8(m[2].replace(/\s+/g,''))};}
/* تنزيل ملف البرنامج من الخادم بأجزائه (نفس طريقة البرنامج على الكمبيوتر) واستخراج تطبيق المندوب منه */
function download(onp){return post({action:'getAppPart',i:0,rep:1}).then(function(r0){if(!r0||!r0.ok||typeof r0.part!=='string')throw new Error('noupd');
  var total=+r0.total||1,ver=r0.ver,parts=new Array(total);parts[0]=r0.part;var done=1,next=1;
  return new Promise(function(res,rej){var active=0,failed=false;
   function get(i,tries){active++;post({action:'getAppPart',i:i,rep:1}).then(function(r){active--;if(r&&r.ok&&typeof r.part==='string'&&r.ver===ver){parts[i]=r.part;done++;if(onp)onp(done,total);pump();}else if(tries>1){get(i,tries-1);}else{failed=true;rej(new Error('part'));}},function(){active--;if(tries>1)setTimeout(function(){get(i,tries-1);},1500);else{failed=true;rej(new Error('net'));}});}
   function pump(){if(failed)return;while(active<3&&next<total)get(next++,4);if(done===total){var x=extract(parts.join(''));if(!x)rej(new Error('norep'));else res(x);}}
   pump();});});}
function serverVer(){return fetch(URL_+'?check=app',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){return +(j&&(j.version||j.ver))||0;}).catch(function(){return 0;});}
var CHECKER=function(){/* يُحقن داخل تطبيق المندوب بعد فتحه */
 var W=window;if(W.__ecoRepUpd)return;W.__ecoRepUpd=1;
 function bar(t){var b=document.getElementById('ecoRepUpdBar');if(!t){if(b)b.remove();return;}if(!b){b=document.createElement('div');b.id='ecoRepUpdBar';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483600;background:#b42318;color:#fff;text-align:center;font:700 14px Tahoma,Arial;padding:9px 10px;direction:rtl';document.body.appendChild(b);}b.innerHTML=t;}
 function go(v){var end=Date.now()+60000;var t=setInterval(function(){var s=Math.max(0,Math.ceil((end-Date.now())/1000));bar('⏱ سيتم تحديث التطبيق تلقائياً إلى الإصدار '+v+' خلال 0:'+String(s).padStart(2,'0')+' — ما سجّلته محفوظ على الموبايل');if(s<=0){clearInterval(t);location.reload();}},500);}
 function chk(){if(W.__ecoRepBusy)return;W.__ecoRepBusy=1;W.__ecoRepServerVer().then(function(sv){if(!(sv>W.ECO_REP_VER)){W.__ecoRepBusy=0;return;}return W.__ecoRepDownload().then(function(x){if(x&&x.v>W.ECO_REP_VER)return W.__ecoRepPut({v:x.v,rep:x.rep,at:new Date().toISOString()}).then(function(){go(x.v);});W.__ecoRepBusy=0;});}).catch(function(){W.__ecoRepBusy=0;});}
 setTimeout(chk,8000);setInterval(chk,15*60*1000);};
function run(x){window.ECO_REP_VER=x.v;window.__ecoRepServerVer=serverVer;window.__ecoRepDownload=download;window.__ecoRepPut=iput;
 var inj='<script>window.ECO_REP_VER='+x.v+';('+CHECKER.toString()+')();<\/script>';var h=x.rep,i=h.toLowerCase().lastIndexOf('</body>');h=i>-1?h.slice(0,i)+inj+h.slice(i):h+inj;
 document.open();document.write(h);document.close();}
function msg(t,s){var a=document.getElementById('lm'),b=document.getElementById('ls');if(a)a.textContent=t;if(b)b.textContent=s||'';}
iget().then(function(c){
 if(c&&c.rep){run(c);return;}
 msg('جارٍ تنزيل التطبيق لأول مرة…','');
 download(function(d,t){msg('جارٍ تنزيل التطبيق لأول مرة…',d+' / '+t);}).then(function(x){return iput({v:x.v,rep:x.rep,at:new Date().toISOString()}).then(function(){run(x);});})
 .catch(function(){fetch('rep.html',{cache:'no-store'}).then(function(r){return r.text();}).then(function(h){run({v:LOADER,rep:h});}).catch(function(){msg('تعذّر التحميل — تحقّق من الإنترنت ثم أعد فتح التطبيق','');});});
});
</script>
</body>
</html>
