<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>إيكوواط — رأيك يهمّنا</title>
<style>
:root{--n:#0a246a;--o:#ff8c00}
*{box-sizing:border-box}body{margin:0;background:#f1f1ef;font:16px Tahoma,Arial,sans-serif;color:#1f2937}
header{background:var(--n);color:#fff;padding:16px;text-align:center;border-bottom:4px solid var(--o)}header b{font-size:22px}
main{max-width:480px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0001;text-align:center}
.st{display:flex;justify-content:center;gap:6px;direction:ltr;margin:14px 0}.st button{font-size:42px;background:none;border:0;color:#d1d5db;cursor:pointer;padding:0 2px}.st button.on{color:var(--o)}
textarea{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px;font:15px Tahoma;margin-top:6px}
.go{display:block;width:100%;border:0;border-radius:10px;padding:14px;font:700 17px Tahoma;background:var(--o);color:#fff;margin-top:12px;cursor:pointer}.go:disabled{opacity:.5}
.mut{color:#6b7280;font-size:14px}.ok{color:#127a3c;font-weight:700;font-size:18px}.bad{color:#b42318}
</style></head><body>
<header><b>إيكوواط</b><div style="font-size:14px;opacity:.9">رأيك يهمّنا</div></header>
<main><div class="card" id="c"><p class="mut">جارٍ التحميل…</p></div><p class="mut" style="text-align:center;margin-top:12px">لا نطلب منك أي بيانات شخصية.</p></main>
<script>
/* ECOwatt 20261300 (hobj) — صفحة تقييم العميل للخدمة (1–5 نجوم). تتصل بالخادم المركزي بأمري srv:get و srv:rate فقط. */
var URL_='https://script.google.com/macros/s/AKfycbwwgY1U4QpfAV489MkN7rPfemC0sSkN8QTgTh4D8PO5dBkIh6J8TOPBR0s-CswSpiNrPQ/exec';
var C=document.getElementById('c'),T=(/[#&]t=([a-f0-9]{40})/.exec(location.hash)||[])[1]||'',S=0;
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function api(o){return fetch(URL_,{method:'POST',body:JSON.stringify(o)}).then(function(r){return r.json();});}
function bad(t){C.innerHTML='<p class="bad">'+E(t)+'</p>';}
if(!T)bad('الرابط غير صحيح.');else api({action:'srv:get',t:T}).then(function(r){
 if(!r||!r.ok)return bad((r&&r.why)||'الرابط غير صحيح.');
 if(r.answered)return C.innerHTML='<p class="ok">شكراً لك — تم استلام تقييمك مسبقاً 🌟</p>';
 if(r.expired)return bad('انتهت صلاحية هذا الرابط.');
 C.innerHTML='<p>كيف تقيّم <b>'+E(r.label)+'</b> من إيكوواط؟</p><div class="mut">رقم العملية: '+E(r.ref)+'</div><div class="st" id="st">'+[1,2,3,4,5].map(function(i){return '<button type="button" data-v="'+i+'" aria-label="'+i+'">★</button>';}).join('')+'</div><div class="mut" id="lb">اختر عدد النجوم</div><textarea id="cm" rows="3" maxlength="400" placeholder="ملاحظة (اختياري)"></textarea><button class="go" id="go" disabled>إرسال التقييم</button>';
 var L=['','سيئ جداً','سيئ','مقبول','جيد','ممتاز'];
 [].forEach.call(C.querySelectorAll('[data-v]'),function(b){b.onclick=function(){S=+b.getAttribute('data-v');[].forEach.call(C.querySelectorAll('[data-v]'),function(x){x.classList.toggle('on',+x.getAttribute('data-v')<=S);});document.getElementById('lb').textContent=L[S];document.getElementById('go').disabled=false;};});
 document.getElementById('go').onclick=function(){var g=this;g.disabled=true;g.textContent='⏳ جارٍ الإرسال…';
  api({action:'srv:rate',t:T,score:S,comment:document.getElementById('cm').value}).then(function(x){if(x&&x.ok)C.innerHTML='<p class="ok">'+E(x.msg||'شكراً لك')+' 🌟</p>';else{g.disabled=false;g.textContent='إرسال التقييم';alert((x&&x.why)||'تعذّر الإرسال — أعد المحاولة');}},function(){g.disabled=false;g.textContent='إرسال التقييم';alert('تعذّر الاتصال — تحقق من الإنترنت');});};
},function(){bad('تعذّر الاتصال — تحقق من الإنترنت وأعد فتح الرابط.');});
</script></body></html>
