/* ===== ECOwatt — تطبيق المدير للجوال (المرحلة 1) =====

}

 add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'.replace(/[\xE2\xE3\xCF\xD3]/g,'A'));var n=canvases.length,objs=2+n*3;
 xref[1]=off;add('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n');
 xref[2]=off;add('2 0 obj<</Type/Pages/Count '+n+'/Kids['+canvases.map(function(_,i){return (3+i*3)+' 0 R';}).join(' ')+']>>endobj\n');
 canvases.forEach(function(cv,i){var p=3+i*3,im=p+1,ct=p+2,jpg=b64bytes(cv.toDataURL('image/jpeg',0.85)),cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  xref[p]=off;add(p+' 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 '+im+' 0 R>>>>/Contents '+ct+' 0 R>>endobj\n');
  xref[im]=off;add(im+' 0 obj<</Type/XObject/Subtype/Image/Width '+cv.width+'/Height '+cv.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>stream\n');add(jpg);add('\nendstream endobj\n');
  xref[ct]=off;add(ct+' 0 obj<</Length '+cs.length+'>>stream\n'+cs+'\nendstream endobj\n');});
 var xo=off,t='xref\n0 '+(objs+1)+'\n0000000000 65535 f \n';for(var k=1;k<=objs;k++)t+=String(xref[k]).padStart(10,'0')+' 00000 n \n';add(t+'trailer<</Size '+(objs+1)+'/Root 1 0 R>>\nstartxref\n'+xo+'\n%%EOF');
 return new Blob(parts,{type:'application/pdf'});}
function toBlob(cv){return new Promise(function(res){cv.toBlob(function(b){res(b);},'image/png');});}
function shareFiles(files,text,phone){var can=navigator.canShare&&navigator.canShare({files:files});
 if(can){return navigator.share({files:files,text:text}).catch(function(e){if(e&&e.name!=='AbortError')dlFiles(files,text,phone);});}
 return dlFiles(files,text,phone);}
function dlFiles(files,text,phone){files.forEach(function(f){var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},1000);});
 if(phone)setTimeout(function(){window.open('https://wa.me/'+String(phone).replace(/\D/g,'').replace(/^0/,'970')+'?text='+encodeURIComponent(text),'_blank');},800);
 alert('نُزّل الملف على الجوال — أرفقه في واتساب العميل.');return Promise.resolve();}
function sendDoc(spec,name,kind,text,phone){var pages=renderDoc(spec);
 if(kind==='pdf'){var f=new File([makePdf(pages)],name+'.pdf',{type:'application/pdf'});return shareFiles([f],text,phone);}
 return Promise.all(pages.map(toBlob)).then(function(bs){return shareFiles(bs.map(function(b,i){return new File([b],name+(bs.length>1?('-'+(i+1)):'')+'.png',{type:'image/png'});}),text,phone);});}
